apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: checkout-service
          # Public image -- the code is mounted from the ConfigMap below.
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/main.py"]
          env:
            - name: PORT
              value: "8080"
            # Resident memory the service grows to at startup (~50 MB).
            - name: TARGET_MEMORY_MI
              value: "48"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              # RCA follow-up (incident-checkout-20261030): the app warms to
              # TARGET_MEMORY_MI (48Mi) and reaches ~57Mi RSS with Python overhead.
              # 32Mi OOMKilled every pod; 64Mi left <10% headroom and was also
              # OOMKilled. Keep the limit >= 2x TARGET_MEMORY_MI.
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: checkout-service-code
